<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wallet | KrushiSetu Farmer</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <div class="page-header"><h1>My Wallet</h1></div>
  <div class="alert" id="alertBox" style="display:none;"></div>

  <div class="dashboard-cards">
    <div class="stat-card"><div class="label">Available Balance</div><div class="value" id="balanceVal">₹0.00</div></div>
    <div class="stat-card"><div class="label">Total Earned</div><div class="value" id="earnedVal">₹0.00</div></div>
    <div class="stat-card"><div class="label">Total Withdrawn</div><div class="value" id="withdrawnVal">₹0.00</div></div>
  </div>

  <div class="form-card" style="max-width:100%;">
    <h3>Request Withdrawal</h3>
    <p style="color:#4a504a;font-size:13px;">Minimum withdrawal amount: ₹100. Funds are transferred to your registered bank account after admin verification.</p>
    <form id="withdrawForm" novalidate>
      <div class="form-row">
        <div class="form-group"><label>Amount (₹)</label><input type="number" id="amount" min="100" step="0.01" required /><div class="field-error" data-error-for="amount"></div></div>
        <div class="form-group"><label>Bank Account Number</label><input id="bank_account_number" required /><div class="field-error" data-error-for="bank_account_number"></div></div>
        <div class="form-group"><label>IFSC Code</label><input id="bank_ifsc" style="text-transform:uppercase;" required /><div class="field-error" data-error-for="bank_ifsc"></div></div>
      </div>
      <button class="btn btn-primary" type="submit">Request Withdrawal</button>
    </form>
  </div>

  <h3>Transaction History</h3>
  <div id="txList"></div>

  <h3>Withdrawal Requests</h3>
  <div id="withdrawList"></div>
</div>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script>
  Auth.requireRole('farmer');
  const alertBox = document.getElementById('alertBox');

  async function loadWallet() {
    const res = await api.get('/wallet');
    document.getElementById('balanceVal').textContent = `₹${Number(res.data.balance).toFixed(2)}`;
    document.getElementById('earnedVal').textContent = `₹${Number(res.data.total_earned).toFixed(2)}`;
    document.getElementById('withdrawnVal').textContent = `₹${Number(res.data.total_withdrawn).toFixed(2)}`;
  }

  async function loadTransactions() {
    const res = await api.get('/wallet/transactions');
    const el = document.getElementById('txList');
    if (!res.data.length) { el.innerHTML = '<div class="empty-state">No transactions yet.</div>'; return; }
    el.innerHTML = `<table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Description</th><th>Balance After</th></tr></thead><tbody>
      ${res.data.map((t) => `<tr>
        <td>${new Date(t.created_at).toLocaleString()}</td>
        <td>${t.type}</td>
        <td>₹${Number(t.amount).toFixed(2)}</td>
        <td>${t.description || ''}</td>
        <td>₹${Number(t.balance_after).toFixed(2)}</td>
      </tr>`).join('')}
    </tbody></table>`;
  }

  async function loadWithdrawals() {
    const res = await api.get('/wallet/withdrawals');
    const el = document.getElementById('withdrawList');
    if (!res.data.length) { el.innerHTML = '<div class="empty-state">No withdrawal requests yet.</div>'; return; }
    el.innerHTML = `<table class="data-table"><thead><tr><th>Date</th><th>Amount</th><th>Status</th><th>Remark</th></tr></thead><tbody>
      ${res.data.map((w) => `<tr>
        <td>${new Date(w.created_at).toLocaleString()}</td>
        <td>₹${Number(w.amount).toFixed(2)}</td>
        <td><span class="status-pill status-${w.status}">${w.status}</span></td>
        <td>${w.admin_remark || ''}</td>
      </tr>`).join('')}
    </tbody></table>`;
  }

  document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert(alertBox);
    renderFormErrors(null, alertBox);
    try {
      await api.post('/wallet/withdraw', {
        amount: Number(document.getElementById('amount').value),
        bank_account_number: document.getElementById('bank_account_number').value.trim(),
        bank_ifsc: document.getElementById('bank_ifsc').value.trim().toUpperCase(),
      });
      showAlert(alertBox, 'Withdrawal request submitted.', 'success');
      e.target.reset();
      loadWallet(); loadTransactions(); loadWithdrawals();
    } catch (err) {
      if (err.errors) renderFormErrors(err.errors, alertBox);
      showAlert(alertBox, err.message);
    }
  });

  loadWallet();
  loadTransactions();
  loadWithdrawals();
</script>
</body>
</html>
