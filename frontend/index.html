<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KrushiSetu | Farm Fresh, Direct to You</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <div class="page-header">
    <h1>Fresh from the Farm</h1>
    <p>Buy directly from farmers — no middlemen, fair prices.</p>
  </div>

  <div class="filters-bar">
    <div class="form-group">
      <label for="categoryFilter">Category</label>
      <select id="categoryFilter"><option value="">All</option></select>
    </div>
    <div class="form-group">
      <label for="gradeFilter">Grade</label>
      <select id="gradeFilter">
        <option value="">Any</option>
        <option value="A">Grade A</option>
        <option value="B">Grade B</option>
        <option value="C">Grade C</option>
      </select>
    </div>
    <div class="form-group">
      <label for="minPrice">Min Price</label>
      <input type="number" id="minPrice" min="0" />
    </div>
    <div class="form-group">
      <label for="maxPrice">Max Price</label>
      <input type="number" id="maxPrice" min="0" />
    </div>
    <div class="form-group" style="flex:2;">
      <label for="searchBox">Search</label>
      <input type="text" id="searchBox" placeholder="e.g. tomatoes" />
    </div>
    <button class="btn btn-primary" id="applyFiltersBtn">Apply</button>
  </div>

  <div id="productGrid" class="grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">No products match your filters.</div>
</div>

<footer>© 2026 KrushiSetu — Farmer to Customer Marketplace</footer>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script>
  sessionStorage.removeItem('ks_selected_product_id');
  const grid = document.getElementById('productGrid');
  const emptyState = document.getElementById('emptyState');
  const categoryFilter = document.getElementById('categoryFilter');

  async function loadCategories() {
    try {
      const res = await api.get('/categories');
      res.data.forEach((c) => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        categoryFilter.appendChild(opt);
      });
    } catch (err) { console.error(err); }
  }

  function buildQuery() {
    const params = new URLSearchParams();
    const category_id = categoryFilter.value;
    const grade = document.getElementById('gradeFilter').value;
    const min_price = document.getElementById('minPrice').value;
    const max_price = document.getElementById('maxPrice').value;
    const search = document.getElementById('searchBox').value.trim();
    if (category_id) params.set('category_id', category_id);
    if (grade) params.set('grade', grade);
    if (min_price) params.set('min_price', min_price);
    if (max_price) params.set('max_price', max_price);
    if (search) params.set('search', search);
    return params.toString();
  }

  function gradeRow(label, price, qty) {
    if (price == null) return '';
    return `<div class="grade-price-row"><span>Grade ${label} (${qty} left)</span><strong>₹${Number(price).toFixed(2)}</strong></div>`;
  }

  async function loadProducts() {
    grid.innerHTML = '<p>Loading...</p>';
    try {
      const query = buildQuery();
      const res = await api.get(`/products${query ? '?' + query : ''}`);
      const products = res.data;
      if (!products.length) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';
      grid.innerHTML = products.map((p) => `
        <div class="product-card">
          <img src="${p.image_url || 'https://placehold.co/300x150?text=' + encodeURIComponent(p.name)}" alt="${p.name}" />
          <div class="body">
            <div class="category">${p.category_name} • by ${p.farmer_name}</div>
            <h3>${p.name}</h3>
            ${gradeRow('A', p.grade_a_price, p.grade_a_quantity)}
            ${gradeRow('B', p.grade_b_price, p.grade_b_quantity)}
            ${gradeRow('C', p.grade_c_price, p.grade_c_quantity)}
            <div style="margin-top:auto;padding-top:10px;">
              <a href="product.html?id=${encodeURIComponent(p.id)}" data-product-id="${p.id}" class="btn btn-primary btn-block">View & Buy</a>
            </div>
          </div>
        </div>
      `).join('');
    } catch (err) {
      grid.innerHTML = `<p class="alert alert-error">${err.message}</p>`;
    }
  }

  grid.addEventListener('click', (event) => {
    const link = event.target.closest('a[data-product-id]');
    if (link && /^[1-9]\d*$/.test(link.dataset.productId)) {
      sessionStorage.setItem('ks_selected_product_id', link.dataset.productId);
    }
  });

  document.getElementById('applyFiltersBtn').addEventListener('click', loadProducts);
  loadCategories();
  loadProducts();
</script>
</body>
</html>
