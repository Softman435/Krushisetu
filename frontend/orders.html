<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders | KrushiSetu</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <div class="page-header"><h1>My Orders</h1></div>
  <div class="alert" id="alertBox" style="display:none;"></div>
  <div id="ordersList"></div>
</div>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script>
  Auth.requireRole('customer');
  const alertBox = document.getElementById('alertBox');
  const ordersList = document.getElementById('ordersList');

  if (new URLSearchParams(window.location.search).get('placed')) {
    showAlert(alertBox, 'Order placed successfully!', 'success');
  }

  async function cancelOrder(id) {
    const reason = prompt('Reason for cancellation (optional):') || '';
    try {
      await api.patch(`/orders/${id}/cancel`, { reason });
      loadOrders();
    } catch (err) { alert(err.message); }
  }

  async function loadOrders() {
    try {
      const res = await api.get('/orders/my');
      if (!res.data.length) { ordersList.innerHTML = '<div class="empty-state">You have no orders yet.</div>'; return; }
      ordersList.innerHTML = `
        <table class="data-table">
          <thead><tr><th>Order #</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead>
          <tbody>
          ${res.data.map((o) => `
            <tr>
              <td>${o.order_number}</td>
              <td>${new Date(o.created_at).toLocaleDateString()}</td>
              <td>₹${Number(o.total_amount).toFixed(2)}</td>
              <td><span class="status-pill status-${o.payment_status}">${o.payment_status}</span> (${o.payment_method})</td>
              <td><span class="status-pill status-${o.order_status}">${o.order_status}</span></td>
              <td>
                ${['placed', 'confirmed'].includes(o.order_status)
                  ? `<button class="btn btn-sm btn-danger" onclick="cancelOrder(${o.id})">Cancel</button>`
                  : ''}
              </td>
            </tr>
          `).join('')}
          </tbody>
        </table>`;
    } catch (err) { showAlert(alertBox, err.message); }
  }

  loadOrders();
</script>
</body>
</html>
