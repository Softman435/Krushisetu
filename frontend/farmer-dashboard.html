<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Products | KrushiSetu Farmer</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <div class="page-header"><h1>My Products</h1></div>
  <div class="alert" id="alertBox" style="display:none;"></div>

  <div class="form-card" style="max-width:100%;">
    <h3>Add New Product</h3>
    <form id="productForm" novalidate>
      <div class="form-row">
        <div class="form-group"><label>Product Name</label><input id="name" required /><div class="field-error" data-error-for="name"></div></div>
        <div class="form-group">
          <label>Category</label>
          <select id="category_id" required></select>
          <div class="field-error" data-error-for="category_id"></div>
        </div>
      </div>
      <div class="form-group"><label>Description</label><textarea id="description" rows="2"></textarea></div>
      <div class="form-row">
        <div class="form-group">
          <label>Unit</label>
          <select id="unit">
            <option value="kg">kg</option><option value="gram">gram</option><option value="litre">litre</option>
            <option value="dozen">dozen</option><option value="piece">piece</option><option value="quintal">quintal</option>
          </select>
        </div>
        <div class="form-group"><label>Image URL (optional)</label><input id="image_url" /></div>
      </div>

      <hr />
      <p style="color:#4a504a;font-size:13px;">Set price &amp; quantity for at least one grade. Leave a grade's price blank if not offered.</p>
      <div class="form-row">
        <div class="form-group"><label>Grade A Price (₹)</label><input type="number" step="0.01" id="grade_a_price" /></div>
        <div class="form-group"><label>Grade A Quantity</label><input type="number" step="0.01" id="grade_a_quantity" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Grade B Price (₹)</label><input type="number" step="0.01" id="grade_b_price" /></div>
        <div class="form-group"><label>Grade B Quantity</label><input type="number" step="0.01" id="grade_b_quantity" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Grade C Price (₹)</label><input type="number" step="0.01" id="grade_c_price" /></div>
        <div class="form-group"><label>Grade C Quantity</label><input type="number" step="0.01" id="grade_c_quantity" /></div>
      </div>
      <div class="field-error" data-error-for=""></div>
      <button type="submit" class="btn btn-primary">Submit for Approval</button>
    </form>
  </div>

  <h3>Status of Your Listings</h3>
  <div id="productList" class="grid"></div>
</div>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script>
  Auth.requireRole('farmer');
  const alertBox = document.getElementById('alertBox');

  async function loadCategories() {
    const select = document.getElementById('category_id');
    const res = await api.get('/categories');
    select.innerHTML = '<option value="">Select category</option>' +
      res.data.map((c) => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  function gradeValue(id) {
    const val = document.getElementById(id).value;
    return val === '' ? null : Number(val);
  }

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert(alertBox);
    renderFormErrors(null, alertBox);
    try {
      await api.post('/products', {
        name: document.getElementById('name').value.trim(),
        category_id: Number(document.getElementById('category_id').value),
        description: document.getElementById('description').value.trim(),
        unit: document.getElementById('unit').value,
        image_url: document.getElementById('image_url').value.trim(),
        grade_a_price: gradeValue('grade_a_price'),
        grade_a_quantity: gradeValue('grade_a_quantity') || 0,
        grade_b_price: gradeValue('grade_b_price'),
        grade_b_quantity: gradeValue('grade_b_quantity') || 0,
        grade_c_price: gradeValue('grade_c_price'),
        grade_c_quantity: gradeValue('grade_c_quantity') || 0,
      });
      showAlert(alertBox, 'Product submitted for admin approval.', 'success');
      e.target.reset();
      loadProducts();
    } catch (err) {
      if (err.errors) renderFormErrors(err.errors, alertBox);
      showAlert(alertBox, err.message);
    }
  });

  async function deleteProduct(id) {
    if (!confirm('Delete this product?')) return;
    try { await api.delete(`/products/${id}`); loadProducts(); }
    catch (err) { showAlert(alertBox, err.message); }
  }

  async function loadProducts() {
    const list = document.getElementById('productList');
    try {
      const res = await api.get('/products/farmer/mine');
      if (!res.data.length) { list.innerHTML = '<div class="empty-state">No products listed yet.</div>'; return; }
      list.innerHTML = res.data.map((p) => `
        <div class="product-card"><div class="body">
          <div class="category">${p.category_name}</div>
          <h3>${p.name} <span class="status-pill status-${p.status}">${p.status}</span></h3>
          ${p.grade_a_price != null ? `<div class="grade-price-row"><span>Grade A</span><strong>₹${Number(p.grade_a_price).toFixed(2)} (${p.grade_a_quantity} left)</strong></div>` : ''}
          ${p.grade_b_price != null ? `<div class="grade-price-row"><span>Grade B</span><strong>₹${Number(p.grade_b_price).toFixed(2)} (${p.grade_b_quantity} left)</strong></div>` : ''}
          ${p.grade_c_price != null ? `<div class="grade-price-row"><span>Grade C</span><strong>₹${Number(p.grade_c_price).toFixed(2)} (${p.grade_c_quantity} left)</strong></div>` : ''}
          ${p.status === 'rejected' ? `<p style="color:#c0392b;font-size:13px;">Reason: ${p.rejection_reason || 'N/A'}</p>` : ''}
          <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
        </div></div>
      `).join('');
    } catch (err) { showAlert(alertBox, err.message); }
  }

  loadCategories();
  loadProducts();
</script>
</body>
</html>
